name: CPU reproducibility tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ""
      OSHC_TEST_NO_NETWORK: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install CPU-only reference test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.1.2 torchvision==0.16.2 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 scipy==1.11.4 scikit-image==0.22.0
          python -m pip install -e '.[test]'
      - name: Test without dataset or pretrained-weight downloads
        run: python -m pytest -q --disable-warnings
      - name: Verify publication inventory and saved numerical evidence
        run: |
          python scripts/verify_release.py --require-manifest
          python scripts/verify_aes_results.py
