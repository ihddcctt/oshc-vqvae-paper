experiment:
  name: stl10_stagec_d64_k128_software
  seed: 20260907
dataset:
  name: stl10
  root: datasets/STL10
  download: false
  train_split: unlabeled
  validation_split: train
  test_split: test
  validation_size: 5000
  train_horizontal_flip_probability: 0.5
  native_resolution: [96, 96]
model:
  quantizer_type: trainable_residual
  latent_dim: 64
  base_codebook_size: 128
  residual_codebook_size: 128
  pretrained_encoder: true
  imagenet_weights: IMAGENET1K_V1
  normalize_latents: true
  loss_reference_dim: 64
  decoder_blocks_per_stage: 1
  decoder_blocks_by_stage: [3, 2, 2]
training:
  epochs: 80
  batch_size: 64
  effective_global_batch_size_4gpu: 256
  distributed_batch_size_mode: per_rank
  checkpoint_selection: correct_validation_mse
  num_workers: 8
  learning_rate: 0.0003
  encoder_learning_rate_scale: 0.1
  weight_decay: 0.0001
  reconstruction_loss: mse
  perceptual_weight: 0.0
  commitment_weight: 0.25
  codebook_weight: 1.0
  residual_norm_weight: 0.0001
  wrong_state_weight: 0.0
  residual_only_weight: 0.0
  amp: true
  state_assignment: single_state
upgrade:
  stage: STL10-Stage-C
  changed_variable: native_image_resolution_and_dataset
  source_config: configs/visual_quality_stage_c_software_k128_mse.yaml
  stl10_base_commit: 767d6bade24cf31554b3695dd0371732e518a254
